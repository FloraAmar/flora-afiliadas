<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Cadastro de Afiliada · Flora Amar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Sacramento&display=swap">
<style>
:root{--bg:#efe8de;--surface:#f8f4ee;--line:#d9cec0;--fg:#2b2a28;--muted:#6f6a63;--accent:#5f8f87;--accent-deep:#4a766f;--accent-soft:#dfe9e5;--on-accent:#fff;--ok:#3d7a5a;--ok-soft:#e2f0e8;--bad:#b3363b;--bad-soft:#f8e1e1;--body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;--script:"Sacramento","Brush Script MT",cursive;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1b1a18;--surface:#24221f;--line:#3a3631;--fg:#f1ece5;--muted:#b3aba1;--accent:#8fbcb3;--accent-deep:#a6cdc5;--accent-soft:#263532;--on-accent:#14201e;--ok:#7cc59d;--ok-soft:#1f3329;--bad:#ef8a8d;--bad-soft:#3d1f21;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--body)}
.in{max-width:720px;margin:0 auto;padding-block:28px 60px;padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right));display:flex;flex-direction:column;gap:20px}
.logo{font-weight:700;font-size:20px;text-decoration:none;color:var(--fg)}.logo span{color:var(--accent)}
h1{font-weight:300;text-transform:uppercase;font-size:clamp(28px,5vw,40px);line-height:1.08;margin:0;text-wrap:balance}
h1 b{font-weight:700}
.sc{font-family:var(--script);font-size:34px;line-height:1;color:var(--accent-deep)}
.lead{color:var(--muted);margin:0;max-width:60ch}
.voucher{background:var(--accent);color:var(--on-accent);border-radius:14px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.voucher code{font-size:22px;font-weight:700;letter-spacing:.05em}
.voucher small{display:block;opacity:.9}
form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
legend{font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}
label small{font-weight:400;color:var(--muted)}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
input.err,select.err{border-color:var(--bad)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cupom{display:flex;align-items:stretch}
.cupom input{text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.prev{font-size:13px;color:var(--muted)}
.prev b{color:var(--accent-deep)}
.aceite{flex-direction:row;align-items:flex-start;gap:10px;font-weight:400}
.aceite input{width:auto;margin-top:4px}
.cta{background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:14px 26px;font:600 14px var(--body);letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.cta:disabled{opacity:.6}
.msg{border-radius:10px;padding:12px 14px;font-weight:600}
.msg.err{background:var(--bad-soft);color:var(--bad)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.small-btn{font:600 13px var(--body);border-radius:999px;border:1px solid rgba(255,255,255,.5);background:transparent;color:inherit;padding:7px 14px;cursor:pointer}
.note{font-size:12.5px;color:var(--muted)}
@media (max-width:520px){.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="in">
  <a class="logo" href="https://www.floraamar.com.br/">flora <span>amar</span></a>
  <div id="topo"><p class="lead">Carregando seu cadastro…</p></div>
  <div id="conteudo"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const fmtD=d=>d?new Date(d+"T12:00:00").toLocaleDateString("pt-BR"):"";
const q=new URLSearchParams(location.search);const P=q.get("p")||"",T=q.get("t")||"";
async function post(u,b){const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});const j=await r.json().catch(()=>({erro:"Erro de conexão. Tente de novo."}));if(!r.ok){const e=new Error(j.erro||"Erro");e.campo=j.campo;throw e}return j}
const maskCpf=v=>v.replace(/\D/g,"").slice(0,11).replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d{1,2})$/,"$1-$2");
const maskTel=v=>{const d=v.replace(/\D/g,"").slice(0,11);return d.length>10?d.replace(/(\d{2})(\d{5})(\d{0,4})/,"($1) $2-$3"):d.replace(/(\d{2})(\d{4})(\d{0,4})/,"($1) $2-$3").replace(/[-\s(]+$/,"")};
function sucesso(cupom,info){
  $("#conteudo").innerHTML=`<div class="msg ok">Cadastro recebido! Seu cupom desejado é <b>${esc(cupom)}</b>.</div><p class="lead">A equipe Flora Amar vai cadastrar você no programa de afiliados. Depois do seu vídeo de recebidos, você recebe o e-mail de acesso da plataforma e o cupom é ativado.</p><p class="lead">Dúvidas: WhatsApp ${esc(info.whatsMkt)}</p>`;
}
(async()=>{
  let info;
  try{info=await post("/api/cadastro/info",{p:P,t:T})}catch(e){$("#topo").innerHTML=`<h1>Cadastro de <b>afiliada</b></h1><div class="msg err">${esc(e.message)}</div>`;return}
  const n=(info.nome||"").split(" ")[0];
  $("#topo").innerHTML=`<div class="sc">Parabéns, ${esc(n)}!</div><h1>Você foi <b>aprovada</b></h1><p class="lead" style="margin-top:10px">Complete seu cadastro de afiliada. Com estes dados a equipe cadastra você no programa de afiliados da loja e cria o seu cupom exclusivo.</p>`
   +(info.voucher?`<div class="voucher" style="margin-top:16px"><div><small>Seu voucher de looks · ${brl(info.voucher.valor)} · válido até ${fmtD(info.voucher.validade)}</small><code>${esc(info.voucher.codigo)}</code></div><button type="button" class="small-btn" id="cpV">Copiar</button></div>`:"");
  if(info.enviado&&!q.has("editar")){sucesso(info.dados.cupom,info);$("#conteudo").insertAdjacentHTML("beforeend",`<a href="${location.pathname}${location.search}&editar=1" class="note">Corrigir meus dados</a>`);return}
  const opt=(arr,sel)=>arr.map(x=>`<option ${x===sel?"selected":""}>${esc(x)}</option>`).join("");
  const cidade=(info.cidade||"").split("/")[0].trim();
  $("#conteudo").innerHTML=`<form id="f" novalidate>
  <fieldset><legend>Seu cupom exclusivo</legend>
    <label>Nome do cupom que você quer<small>4 a 20 letras ou números, sem espaços. Ex.: ${esc((n||"ANA").toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,""))}${info.desconto}</small><input id="cupom" name="cupom" maxlength="20" autocomplete="off" required></label>
    <div class="prev" id="prev">Suas seguidoras ganham <b>${info.desconto}% OFF</b> e você recebe <b>${info.comissao}% de comissão + ${info.creditoLook}% em crédito look</b>.</div>
  </fieldset>
  <fieldset><legend>Dados para o cadastro de afiliada</legend>
    <label>Nome completo<input id="nome" name="nome" required autocomplete="name" value="${esc(info.nome)}"></label>
    <div class="g2"><label>E-mail<small>para receber o acesso de afiliada</small><input id="email" name="email" type="email" required autocomplete="email" value="${esc(info.email)}"></label>
    <label>E-mail da sua conta no site <small>opcional, se for diferente</small><input id="emailLoja" name="emailLoja" type="email" autocomplete="off"></label></div>
    <div class="g2"><label>CPF<input id="cpf" name="cpf" inputmode="numeric" required placeholder="000.000.000-00"></label>
    <label>Data de nascimento<input id="nascimento" name="nascimento" type="date" required></label></div>
    <div class="g2"><label>Telefone / WhatsApp<input id="telefone" name="telefone" type="tel" required value="${esc(info.whatsapp)}"></label>
    <label>Cidade<input id="cidade" name="cidade" required value="${esc(cidade)}"></label></div>
    <label>Estado<select id="estado" name="estado" required><option value="">Selecione</option>${opt(info.ufs)}</select></label>
  </fieldset>
  <fieldset><legend>Recebimento da comissão</legend>
    <div class="g2"><label>Tipo de chave PIX<select id="tipoPix" name="tipoPix" required><option value="">Selecione</option>${opt(info.tiposPix)}</select></label>
    <label>Chave PIX<input id="chavePix" name="chavePix" required autocomplete="off"></label></div>
  </fieldset>
  <label class="aceite"><input type="checkbox" id="aceite"><span>Autorizo a Flora Amar a usar estes dados só para o meu cadastro no programa de afiliadas e para o pagamento das minhas comissões.</span></label>
  <div id="msg" hidden></div>
  <button class="cta" id="enviar" type="submit">Enviar cadastro</button>
  <p class="note">Seus dados ficam guardados com segurança e só a equipe Flora Amar tem acesso.</p>
  </form>`;
  const uf=(info.cidade||"").split("/")[1];if(uf)$("#estado").value=uf.trim().toUpperCase().slice(0,2);
  $("#cpf").addEventListener("input",e=>e.target.value=maskCpf(e.target.value));
  $("#telefone").addEventListener("input",e=>e.target.value=maskTel(e.target.value));
  $("#cupom").addEventListener("input",e=>{e.target.value=e.target.value.toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Z0-9]/g,"")});
  $("#f").addEventListener("submit",async e=>{
    e.preventDefault();const m=$("#msg"),b=$("#enviar");document.querySelectorAll(".err").forEach(x=>x.classList.remove("err"));
    const d=Object.fromEntries(new FormData(e.target));
    if(!$("#aceite").checked){m.hidden=false;m.className="msg err";m.textContent="Para enviar, marque a autorização de uso dos dados.";return}
    b.disabled=true;b.textContent="Enviando…";
    try{const j=await post("/api/cadastro",{...d,p:P,t:T});scrollTo(0,0);sucesso(j.cupom,info)}
    catch(err){m.hidden=false;m.className="msg err";m.textContent=err.message;if(err.campo&&$("#"+err.campo)){$("#"+err.campo).classList.add("err");$("#"+err.campo).focus()}b.disabled=false;b.textContent="Enviar cadastro"}
  });
})();
document.addEventListener("click",async e=>{if(e.target.id==="cpV"){try{await navigator.clipboard.writeText(e.target.closest(".voucher").querySelector("code").textContent);e.target.textContent="Copiado"}catch(_){}}});
</script>
</body>
</html>
