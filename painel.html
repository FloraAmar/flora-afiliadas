<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Painel de Afiliadas · Flora Amar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: cabeçalho com resumo do funil, faixa de etapas como filtro, lista de cartões; ficha da afiliada abre em painel lateral */
:root{
  --bg:#efe8de; --surface:#f8f4ee; --sunk:#e6ddd1; --line:#d9cec0;
  --fg:#2b2a28; --muted:#6f6a63;
  --accent:#5f8f87; --accent-soft:#dfe9e5; --on-accent:#ffffff;
  --ok:#3d7a5a; --ok-soft:#e2f0e8; --warn:#a8650f; --warn-soft:#fbeedb; --bad:#b3363b; --bad-soft:#f8e1e1;
  --display:"Montserrat", system-ui, sans-serif;
  --body:"Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#181216; --surface:#221a1f; --sunk:#1d161a; --line:#3a2e35; --fg:#f2e9ee; --muted:#b09fa9;
  --accent:#8fbcb3; --accent-soft:#263532; --on-accent:#14201e;
  --ok:#7cc59d; --ok-soft:#1f3329; --warn:#e8b05f; --warn-soft:#3a2b17; --bad:#ef8a8d; --bad-soft:#3d1f21; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#181216; --surface:#221a1f; --sunk:#1d161a; --line:#3a2e35; --fg:#f2e9ee; --muted:#b09fa9;
  --accent:#8fbcb3; --accent-soft:#263532; --on-accent:#14201e;
  --ok:#7cc59d; --ok-soft:#1f3329; --warn:#e8b05f; --warn-soft:#3a2b17; --bad:#ef8a8d; --bad-soft:#3d1f21; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
.brand small{display:block;text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--muted);font-weight:600}
.brand h1{font-family:var(--display);font-weight:500;font-size:clamp(28px,4vw,40px);margin:2px 0 0;line-height:1.05;text-wrap:balance}
.brand h1 em{color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font:inherit;font-weight:600;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 16px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.ghost{background:transparent}
button.danger{color:var(--bad)}
button.small{padding:5px 12px;font-size:12.5px}
button:disabled{opacity:.5;cursor:not-allowed}
.terms{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}
.terms b{color:var(--fg);font-variant-numeric:tabular-nums}
.alert{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);color:var(--bad);border-radius:var(--r);padding:10px 14px;font-weight:600}
.funnel{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;overflow-x:auto}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 10px 9px;text-align:left;min-width:0;display:flex;flex-direction:column;gap:2px;border-radius:var(--r)}
.stage .n{font-family:var(--display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.stage .l{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.25}
.stage .s{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stage.on{border-color:var(--accent);background:var(--accent-soft)}
@media (max-width:820px){.funnel{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:420px){.funnel{grid-template-columns:repeat(2,minmax(0,1fr))}}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar input{flex:1;min-width:180px}
input,textarea,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;min-width:0}
.card:hover{border-color:var(--accent)}
.card .row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card h3{margin:0;font-size:16px;font-weight:700;overflow-wrap:anywhere}
.card .ig{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.card .next{font-size:12.5px;color:var(--muted)}
.card .codes{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.a{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--sunk);border-radius:6px;padding:2px 8px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:34px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h2{font-family:var(--display);font-weight:500;color:var(--fg);margin:0;font-size:24px}
.empty p{max-width:52ch;margin:0}
.status{color:var(--muted);font-size:12.5px}
/* painel */
.scrim{position:fixed;inset:0;background:rgba(20,10,16,.38);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:21;overflow-y:auto;border-left:1px solid var(--line);
  padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.drawer h2{font-family:var(--display);font-weight:500;font-size:28px;margin:0;line-height:1.1;overflow-wrap:anywhere}
.dhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps span{flex:1;min-width:52px;height:5px;border-radius:3px;background:var(--line)}
.steps span.done{background:var(--accent)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.box h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.box.focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:460px){.grid2{grid-template-columns:1fr}}
.kv{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.kv .v{font-weight:700;font-variant-numeric:tabular-nums}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.check input{width:auto;margin-top:3px}
ol.how{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px;font-size:13px}
.msg{white-space:pre-wrap;background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:13px}
.hist{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;z-index:40}
.note{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
[hidden]{display:none!important}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.tab{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;padding:10px 14px;color:var(--muted)}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-size:24px;font-variant-numeric:tabular-nums;line-height:1.15}
.tile span{font-size:12px;color:var(--muted);font-weight:600}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.v{width:100%;border-collapse:collapse;font-size:13px;min-width:860px}
table.v th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.v td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
table.v tr:last-child td{border-bottom:0}
table.v td.n{text-align:right;white-space:nowrap}
table.v th.n{text-align:right}
.nv{display:inline-flex;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:700}
.nv.Bronze{background:#f1e2d3;color:#8a5a2b}.nv.Prata{background:#e6e8ea;color:#4c5660}.nv.Ouro{background:#f7ecc6;color:#8a6a00}
.vbar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}.vbar i{display:block;height:100%;background:var(--accent)}
a.btn{display:inline-flex;align-items:center}
</style>
</head><body>
<div class="wrap" id="app" hidden>
  <header class="top">
    <div class="brand"><small>Flora Amar · programa de afiliadas</small><h1>Afiliadas <em>Flora</em></h1></div>
    <div class="actions">
      <a class="btn ghost" href="/" target="_blank" rel="noopener" style="text-decoration:none">Ver página pública</a>
      <button id="btnConfig" class="ghost">Regras do programa</button>
      <button id="btnImportar" class="ghost">Importar afiliadas</button>
      <button id="btnNova" class="primary">+ Nova afiliada</button>
      <button id="btnSair" class="ghost small">Sair</button>
    </div>
  </header>
  <nav class="tabs" role="tablist"><button class="tab on" data-tab="afiliadas" role="tab">Afiliadas</button><button class="tab" data-tab="vendas" role="tab">Vendas e Bônus Look</button></nav>
  <div id="vendasView" hidden></div>
  <div id="afiliadasView" style="display:flex;flex-direction:column;gap:22px">
  <div class="terms" id="terms"></div>
  <div id="alertBox" hidden></div>
  <nav class="funnel" id="funnel" aria-label="Etapas"></nav>
  <div class="toolbar">
    <input id="busca" type="search" placeholder="Buscar por nome, @instagram, protocolo, cupom ou pedido">
    <select id="ordem" style="width:auto"><option value="recente">Mais recentes</option><option value="prazo">Prazo do vídeo</option><option value="nome">Nome A–Z</option></select>
  </div>
  <div id="status" class="status">Carregando afiliadas…</div>
  <div id="list" class="list"></div>
  </div>
</div>
<div class="wrap" id="login" hidden style="max-width:420px;padding-top:12vh">
  <div class="brand"><small>Flora Amar</small><h1>Painel de <em>afiliadas</em></h1></div>
  <form class="box" id="loginForm"><label class="f">Senha do painel<input id="senha" type="password" autocomplete="current-password" required></label><div id="loginMsg" class="note"></div><button class="primary" type="submit">Entrar</button></form>
</div>
<div id="drawerRoot"></div>
<div id="toast" class="toast" hidden></div>

<script>
const ETAPAS=[
  {k:"proposta",l:"Propostas recebidas",s:"1",next:"Avaliar e aprovar"},
  {k:"aprovada",l:"Aprovada · voucher",s:"2",next:"Cadastrar voucher na wBuy e aguardar a compra"},
  {k:"compra",l:"Looks comprados",s:"3",next:"Enviar os looks"},
  {k:"enviado",l:"Looks a caminho",s:"4",next:"Confirmar a entrega"},
  {k:"entregue",l:"Aguardando vídeo",s:"5",next:"Aguardar o link do vídeo"},
  {k:"video",l:"Vídeo recebido",s:"6",next:"Criar cupom e comissão na wBuy"},
  {k:"ativa",l:"Afiliada ativa",s:"7",next:"Acompanhar vendas"},
  {k:"recusada",l:"Recusadas",s:"–",next:""}
];
const IDX=Object.fromEntries(ETAPAS.map((e,i)=>[e.k,i]));
const DEF={voucherValor:500,desconto:5,comissao:5,prazoDias:15,validadeVoucherDias:30,minSeguidores:1000,creditoLook:10,metaMensal:500,whatsapp:"(11) 92040-3050",inscricoesAbertas:true,nivel1Ate:10000,nivel1Comissao:5,nivel1Bonus:10,nivel2Ate:20000,nivel2Comissao:6,nivel2Bonus:7,nivel3Comissao:7,nivel3Bonus:5,autoFechamento:true};
function nivelDe(t){if(t>cfg.nivel2Ate)return{nome:"Ouro",comissao:cfg.nivel3Comissao,bonus:cfg.nivel3Bonus,proximo:null};if(t>cfg.nivel1Ate)return{nome:"Prata",comissao:cfg.nivel2Comissao,bonus:cfg.nivel2Bonus,proximo:{nome:"Ouro",falta:cfg.nivel2Ate-t}};return{nome:"Bronze",comissao:cfg.nivel1Comissao,bonus:cfg.nivel1Bonus,proximo:{nome:"Prata",falta:cfg.nivel1Ate-t}}}
const INVALIDOS=new Set(["1","2","6","8","10","11"]);
const vendaConta=v=>v.statusId?!INVALIDOS.has(String(v.statusId)):!/cancel|devolv|estorn|recus|negad|aguard|análise|analise/i.test(v.status||"");
let cfg={...DEF}, rows=[], filtro=null, aberta=null, draft=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const hoje=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const fmtD=d=>d?new Date(d+"T12:00:00").toLocaleDateString("pt-BR"):"—";
const addDias=(d,n)=>{const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const diasAte=d=>Math.round((new Date(d+"T12:00:00")-new Date(hoje()+"T12:00:00"))/864e5);
const primeiroNome=n=>(n||"").trim().split(/\s+/)[0]||"";
const slug=n=>primeiroNome(n).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]/g,"").toUpperCase().slice(0,12)||"FLORA";
const waNum=w=>{let d=String(w||"").replace(/\D/g,"");if(d.length<=11)d="55"+d;return d};
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2400)}
async function copiar(t,btn){try{await navigator.clipboard.writeText(t);toast("Copiado")}catch(e){const n=btn?.closest(".box")?.querySelector(".msg");if(n){const r=document.createRange();r.selectNodeContents(n);const s=getSelection();s.removeAllRanges();s.addRange(r)}toast("Selecionado: use Ctrl+C")}}
function codigoUnico(base,id){const usados=new Set(rows.filter(r=>r.id!==id).flatMap(r=>[r.voucher?.codigo,r.cupom?.codigo]).filter(Boolean));let c=base,i=2;while(usados.has(c)){c=base+i;i++}return c}

async function api(m,u,b){const r=await fetch(u,{method:m,headers:b?{"Content-Type":"application/json"}:{},body:b?JSON.stringify(b):undefined});
  if(r.status===401){mostrarLogin();throw new Error("login")}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.erro||"Erro");return j}
async function carregar(){
  try{const [l,c]=await Promise.all([api("GET","/api/admin/afiliadas"),api("GET","/api/admin/config")]);rows=l;cfg={...DEF,...c};
    $("#login").hidden=true;$("#app").hidden=false;$("#status").hidden=true;renderTop();renderList();}
  catch(e){if(e.message!=="login"){$("#status").hidden=false;$("#status").textContent="Não foi possível carregar. Verifique a conexão."}}
}
function mostrarLogin(){$("#app").hidden=true;$("#login").hidden=false;fechar();setTimeout(()=>$("#senha").focus(),50)}
$("#loginForm").addEventListener("submit",async e=>{e.preventDefault();try{await api("POST","/api/login",{senha:$("#senha").value});$("#senha").value="";carregar()}catch(err){$("#loginMsg").textContent=err.message==="login"?"Senha incorreta.":err.message}});

/* ---------- render ---------- */
function prazoInfo(r){
  if(r.etapa!=="entregue"||!r.prazoVideo) return null;
  if(r.videoLink) return {cls:"ok",t:"Vídeo enviado: conferir"};
  const d=diasAte(r.prazoVideo);
  if(d<0) return {cls:"bad",t:`Vídeo atrasado ${-d} dia${-d>1?"s":""}`};
  if(d<=3) return {cls:"warn",t:d===0?"Vídeo vence hoje":`Vídeo vence em ${d} dia${d>1?"s":""}`};
  return {cls:"a",t:`Vídeo até ${fmtD(r.prazoVideo)}`};
}
function renderTop(){
  $("#terms").innerHTML=`<span>Voucher <b>${brl(cfg.voucherValor)}</b></span><span>Desconto clientes <b>${cfg.desconto}%</b></span><span>Níveis <b>${cfg.nivel1Comissao}–${cfg.nivel3Comissao}%</b> comissão · <b>${cfg.nivel3Bonus}–${cfg.nivel1Bonus}%</b> Bônus Look</span><span>Meta <b>${brl(cfg.metaMensal)}</b>/mês</span><span>Vídeo em <b>${cfg.prazoDias} dias</b></span><span>Mínimo <b>${Number(cfg.minSeguidores).toLocaleString("pt-BR")}</b> seguidores</span><span>Inscrições <b>${cfg.inscricoesAbertas?"abertas":"fechadas"}</b></span>`;
  const cont=Object.fromEntries(ETAPAS.map(e=>[e.k,0]));rows.forEach(r=>cont[r.etapa]=(cont[r.etapa]||0)+1);
  $("#funnel").innerHTML=ETAPAS.map(e=>`<button class="stage ${filtro===e.k?"on":""}" data-k="${e.k}" aria-pressed="${filtro===e.k}"><span class="s">${e.s}</span><span class="n">${cont[e.k]}</span><span class="l">${e.l}</span></button>`).join("");
  const atras=rows.filter(r=>r.etapa==="entregue"&&r.prazoVideo&&!r.videoLink&&diasAte(r.prazoVideo)<0);
  const conferir=rows.filter(r=>r.etapa==="entregue"&&r.videoLink);
  const usouVoucher=rows.filter(r=>r.etapa==="compra"&&r.voucher?.usado);
  const ab=$("#alertBox");let h="";
  if(atras.length)h+=`<div class="alert">${atras.length} vídeo${atras.length>1?"s":""} atrasado${atras.length>1?"s":""}: ${atras.map(r=>esc(primeiroNome(r.nome))).join(", ")} <button class="small" data-k="entregue" data-filtro="1">Ver</button></div>`;
  if(conferir.length)h+=`<div class="alert" style="background:var(--ok-soft);color:var(--ok);margin-top:8px">${conferir.length} vídeo${conferir.length>1?"s":""} enviado${conferir.length>1?"s":""} pelas afiliadas para conferir <button class="small" data-k="entregue" data-filtro="1">Ver</button></div>`;
  if(usouVoucher.length)h+=`<div class="alert" style="background:var(--warn-soft);color:var(--warn);margin-top:8px">${usouVoucher.length===1?esc(primeiroNome(usouVoucher[0].nome))+" usou o voucher"+(usouVoucher[0].voucher.pedidoUso?" no pedido "+esc(usouVoucher[0].voucher.pedidoUso):""):usouVoucher.length+" afiliadas usaram o voucher"}: separar e enviar os looks <button class="small" data-k="compra" data-filtro="1">Ver</button></div>`;
  ab.hidden=!h;ab.innerHTML=h;
}
function renderList(){
  const q=$("#busca").value.trim().toLowerCase();
  let l=rows.filter(r=>!filtro||r.etapa===filtro);
  if(q) l=l.filter(r=>[r.nome,r.instagram,r.tiktok,r.protocolo,r.voucher?.codigo,r.cupom?.codigo,r.dadosWbuy?.cupom,r.pedido,r.whatsapp,r.email].join(" ").toLowerCase().includes(q));
  const o=$("#ordem").value;
  l.sort((a,b)=>o==="nome"?(a.nome||"").localeCompare(b.nome||""):o==="prazo"?((a.prazoVideo||"9999")<(b.prazoVideo||"9999")?-1:1):(b.criadoEm||"").localeCompare(a.criadoEm||""));
  const st=$("#status");

  if(e.target.id==="scrim"||t?.id==="fechar"){fechar();return}
  if(!t)return;
  if(t.classList.contains("stage")){filtro=filtro===t.dataset.k?null:t.dataset.k;renderTop();renderList();return}
  if(t.dataset.filtro){filtro=t.dataset.k;renderTop();renderList();return}
  if(t.classList.contains("card")){abrir(t.dataset.id);return}
  if(t.dataset.act){acao(t.dataset.act);return}
  if(t.hasAttribute("data-copy")){copiar(t.closest(".box").querySelector(".msg").textContent,t);return}
  if(t.dataset.copylink){copiar(location.origin+"/",t);return}
  if(t.dataset.cp!==undefined){copiar(t.dataset.cp,t);return}
  if(t.dataset.mail){enviarEmail(t);return}
  if(t.id==="btnNova")novaAfiliada();
  if(t.id==="btnImportar")abrirImportar();
  if(["impBuscar","impLer"].includes(t.id)||t.dataset.impok){acaoImportar(t);return}
  if(t.id==="btnConfig")abrirConfig();
  if(t.id==="cfgSalvar")salvarConfig();
  if(t.dataset.tab){document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));const v=t.dataset.tab==="vendas";$("#vendasView").hidden=!v;$("#afiliadasView").hidden=v;$("#vendasView").style.display=v?"flex":"";$("#vendasView").style.flexDirection="column";$("#vendasView").style.gap="16px";if(v)carregarVendas();return}
  if(["vSync","vCalc","vFechar","vFecharNao","vFecharSim"].includes(t.id)||t.dataset.desfazer){acaoVendas(t);return}
  if(t.id==="btnSair"){await fetch("/api/logout",{method:"POST"});mostrarLogin()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&aberta)fechar()});
document.addEventListener("change",e=>{if(e.target.id==="vMes"){vendasMes=e.target.value;confirmFech=false;carregarVendas()}});
$("#busca").addEventListener("input",renderList);$("#ordem").addEventListener("change",renderList);
carregar();
setInterval(()=>{if(!aberta&&!document.hidden&&!$("#app").hidden)carregar()},60000);
</script>
